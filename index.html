<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars"></div>

<header>
    <div class="logo">🧮</div>
    <div>
        <h1>👑 Kalkulator</h1>
        <p>Hitung lebih mudah, lebih cepat!</p>
    </div>
</header>

<div class="calculator">

    <div class="display">
        <div id="expression"></div>
        <input type="text" id="screen" value="0" readonly>
    </div>

    <div class="content">

        <div class="buttons">
            <button class="pink" onclick="clearAll()">AC</button>
            <button class="pink" onclick="del()">DEL</button>
            <button class="pink" onclick="percent()">%</button>
            <button class="yellow" onclick="add('/')">÷</button>

            <button class="blue" onclick="add('7')">7</button>
            <button class="blue" onclick="add('8')">8</button>
            <button class="blue" onclick="add('9')">9</button>
            <button class="yellow" onclick="add('*')">×</button>

            <button class="blue" onclick="add('4')">4</button>
            <button class="blue" onclick="add('5')">5</button>
            <button class="blue" onclick="add('6')">6</button>
            <button class="yellow" onclick="add('-')">−</button>

            <button class="blue" onclick="add('1')">1</button>
            <button class="blue" onclick="add('2')">2</button>
            <button class="blue" onclick="add('3')">3</button>
            <button class="yellow" onclick="add('+')">+</button>

            <button class="purple" onclick="add('0')">0</button>
            <button class="purple" onclick="add('00')">00</button>
            <button class="purple" onclick="add('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

        <div class="history">
            <h3>🕒 Riwayat Perhitungan</h3>
            <ul id="history"></ul>
            <button class="clear" onclick="clearHistory()">Hapus Riwayat</button>
        </div>

    </div>

</div>

<footer>💖 Semangat Menghitung! 💖</footer>

<div class="cloud">☁️👑</div>

<script src="script.js"></script>
</body>
</html>
